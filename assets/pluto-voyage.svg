<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t">
<title id="t">A small spaceship travels from Earth to Pluto</title>
<defs>
  <radialGradient id="plutoBase" cx="36%" cy="34%" r="70%">
    <stop offset="0" stop-color="#efe0cc"/>
    <stop offset="0.55" stop-color="#cbae8e"/>
    <stop offset="1" stop-color="#8a6a52"/>
  </radialGradient>
  <radialGradient id="plutoShade" cx="30%" cy="30%" r="78%">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <radialGradient id="charonBase" cx="35%" cy="35%" r="75%">
    <stop offset="0" stop-color="#cfcac4"/>
    <stop offset="1" stop-color="#6f6a66"/>
  </radialGradient>
  <radialGradient id="earthBase" cx="35%" cy="35%" r="70%">
    <stop offset="0" stop-color="#8fc0ff"/>
    <stop offset="1" stop-color="#1f5fd1"/>
  </radialGradient>
  <radialGradient id="glowBlue"><stop offset="0" stop-color="#4c8dff" stop-opacity=".35"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowWarm"><stop offset="0" stop-color="#d9b48c" stop-opacity=".16"/><stop offset="1" stop-color="#d9b48c" stop-opacity="0"/></radialGradient>
  <linearGradient id="trailGrad" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="735" y2="0">
    <stop offset="0" stop-color="#c9a27e" stop-opacity="0"/>
    <stop offset="1" stop-color="#e8cfb0" stop-opacity=".7"/>
  </linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff7a3d" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <clipPath id="plutoClip"><circle r="46"/></clipPath>
  <clipPath id="frontHalf"><rect x="-120" y="0" width="240" height="60"/></clipPath>
  <g id="charon">
    <circle r="10" fill="url(#charonBase)"/>
    <circle cx="-2" cy="-3" r="3" fill="#5d5652" opacity=".35"/>
  </g>
</defs>

<rect x=".5" y=".5" width="999" height="239" rx="14" fill="#0d1117" stroke="#21262d"/>

