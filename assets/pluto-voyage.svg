<circle cx="860" cy="112" r="150" fill="url(#glowWarm)"/>
<circle cx="118" cy="156" r="24" fill="url(#glowBlue)"/>
<circle cx="118" cy="156" r="7" fill="url(#earthBase)"/>

<!-- ruta completa, tenue -->
<path d="M118,156 C320,30 560,170 735,122" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round"/>

<!-- Caronte: mitad trasera (detrás de Plutón) -->
<g transform="translate(860 112) rotate(-14)">
  <ellipse rx="82" ry="20" fill="none" stroke="#30363d" stroke-width="1" opacity=".7"/>
  <use href="#charon"><animateMotion dur="16s" repeatCount="indefinite" path="M82,0 A82,20 0 1,1 -82,0 A82,20 0 1,1 82,0"/></use>
</g>

<!-- Plutón -->
<g transform="translate(860 112)">
  <circle r="47.5" fill="none" stroke="#9fc1ff" stroke-width="1.6" opacity=".22"/>
  <g clip-path="url(#plutoClip)">
    <circle r="46" fill="url(#plutoBase)"/>
    <path d="M-48,6 C-36,0 -24,8 -16,16 C-9,23 -13,34 -22,39 C-31,44 -44,32 -48,20 Z" fill="#6e4a3a" opacity=".75"/>
    <ellipse cx="-30" cy="-22" rx="6" ry="3.5" fill="#8f6a55" opacity=".5"/>
    <ellipse cx="-6" cy="32" rx="5" ry="2.5" fill="#7a5644" opacity=".5"/>
    <path transform="rotate(18 12 6)" d="M12,30 C2,20 -8,8 -6,-4 C-4,-14 8,-16 12,-6 C16,-16 30,-14 32,-2 C34,10 22,20 12,30 Z" fill="#f6efe5" opacity=".88"/>
    <circle r="46" fill="url(#plutoShade)"/>
  </g>
  <!-- pulso al llegar -->
  <circle r="48" fill="none" stroke="#e8d5bd" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="48;48;80;80" keyTimes="0;0.68;0.86;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.65;0;0" keyTimes="0;0.679;0.69;0.86;1" dur="11s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Caronte: mitad delantera (delante de Plutón) -->
<g transform="translate(860 112) rotate(-14)">
  <g clip-path="url(#frontHalf)">
    <ellipse rx="82" ry="20" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>
    <use href="#charon"><animateMotion dur="16s" repeatCount="indefinite" path="M82,0 A82,20 0 1,1 -82,0 A82,20 0 1,1 82,0"/></use>
  </g>
</g>

<!-- estela que se dibuja detrás de la nave -->
<path d="M118,156 C320,30 560,170 735,122" fill="none" stroke="url(#trailGrad)" stroke-width="1.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
  <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.68;1" calcMode="spline" keySplines="0.45 0 0.25 1;0 0 1 1" dur="11s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="11s" repeatCount="indefinite"/>
</path>

<!-- nave -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.9;0.97;1" dur="11s" repeatCount="indefinite"/>
  <animateMotion path="M118,156 C320,30 560,170 735,122" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.68;1" calcMode="spline" keySplines="0.45 0 0.25 1;0 0 1 1" dur="11s" repeatCount="indefinite"/>
  <g transform="scale(1.3)">
    <g transform="translate(-11 0)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.66;0.69;1" dur="11s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.35 .85;.85 1.1;1.2 .95;1 1" dur=".35s" repeatCount="indefinite"/>
        <path d="M0,-3 L-13,0 L0,3 Z" fill="url(#flame)"/>
        <path d="M0,-1.5 L-7,0 L0,1.5 Z" fill="#fff3c4"/>
      </g>
    </g>
    <path d="M-6,-4 L-12,-9 L-10,-3.5 Z M-6,4 L-12,9 L-10,3.5 Z" fill="#8b949e"/>
    <path d="M14,0 C9,-5.5 -4,-6 -11,-4 L-11,4 C-4,6 9,5.5 14,0 Z" fill="#e6edf3"/>
    <circle cx="3" r="2" fill="#0d1117" stroke="#58a6ff" stroke-width="1.2"/>
  </g>
</g>

<!-- consola -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">
  <text x="32" y="198">&gt; mission: earth → pluto</text>
  <text x="32" y="218">&gt; status: in transit<tspan>_<animate attributeName="fill-opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.68" calcMode="discrete" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="32" y="218" opacity="0">&gt; status: <tspan fill="#d9b48c">arrived ✓</tspan><tspan>_<animate attributeName="fill-opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.68;0.96" calcMode="discrete" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="968" y="218" text-anchor="end" font-size="12" fill="#484f58">≈ 39.5 AU</text>
</g>
</svg>
